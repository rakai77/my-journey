name: Release & Deployment Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: 'patch'
      custom_version:
        description: 'Custom version if "custom" selected (without v, e.g. 1.0.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  prepare-tag:
    name: Determine or Generate Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve_tag.outputs.tag_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Tag Name
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            echo "Triggered by git tag push: $TAG"
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          else
            echo "Triggered manually via workflow_dispatch"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "Current latest tag: $LATEST_TAG"
            CLEAN_VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            BUMP="${{ github.event.inputs.bump_type }}"
            if [ "$BUMP" = "major" ]; then
              NEW_VERSION="$((MAJOR + 1)).0.0"
            elif [ "$BUMP" = "minor" ]; then
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
            elif [ "$BUMP" = "patch" ]; then
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            elif [ "$BUMP" = "custom" ]; then
              NEW_VERSION="${{ github.event.inputs.custom_version }}"
            fi

            TAG="v${NEW_VERSION#v}"
            echo "Calculated new tag: $TAG"

            # Create and push git tag
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"

            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    name: Build, Release & Publish Container
    needs: prepare-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code at Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-tag.outputs.tag_name }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Quality (Lint & Test)
        run: |
          npm run lint
          npm run test

      - name: Build Production Assets
        run: npm run build

      - name: Create Dist Zip Bundle
        run: |
          cd dist
          zip -r ../journey-web-${{ needs.prepare-tag.outputs.tag_name }}.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-tag.outputs.tag_name }}
          name: Release ${{ needs.prepare-tag.outputs.tag_name }}
          generate_release_notes: true
          files: |
            journey-web-${{ needs.prepare-tag.outputs.tag_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare-tag.outputs.tag_name }}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
